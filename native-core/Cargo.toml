[package]
name = "openhomeo_native"
version = "0.1.0"
edition = "2021"
authors = ["Koustoov <koustoov@openhomeo.local>"]
description = "Native SIMD image processing, polarity math, and cryptographic acceleration for OpenHomeo"

[lib]
name = "openhomeo_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Cryptography
argon2 = "0.5"
rand_core = { version = "0.6", features = ["std"] }
aes-gcm = "0.10"
sha2 = "0.10"

# Numerical & Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
